mcp_port: 15707
ros_namespace: ""   # 留空则自动使用 hostname
name: "Tianyi 2.0 Pro"

# Forward all topics from domain 0 (body controller) to domain 42 (agent-core)
# via socket bridge. This enables proper DDS isolation.
domain_bridge:
  enabled: true

# DEPRECATED: Use domain_bridge instead. Left for backward compatibility.
# Run the skeleton publisher in its own ROS process. The main bundle keeps
# the other cards but does not publish a competing joints topic.
joints_bridge:
  enabled: false

# Make power-on self-check automatic on the robot's x86 motion-control board.
auto_self_check:
  enabled: true
  ssh_host: "192.168.41.1"
  ssh_user: "ubuntu"
  ssh_password: "123"
  timeout: 15

slamtec:
  base_url: "http://192.168.11.1:1448"

plugins:
  navigation_lidar_2d:
    enabled: false
    source_clock_domain: unverified
    axes_verified: false
    sdk_reader_path: ""
    sdk_host: ""
    sdk_port: 1445
    # Fill from verified device specification/calibration, never guessed values.
    range_min_m: null
    range_max_m: null
    angle_increment_rad: null
    base_to_laser: null
    max_age_sec: 0.5
  navigation_odom:
    enabled: false
    odom_time_mode: source  # Explicitly select poll_estimate for limited integration.
    actual_speed_verified: false
    local_odom_verified: false
    poll_hz: 20
    request_timeout_sec: 0.1
    max_age_sec: 0.5
    max_pose_jump_m: 0.5
    max_yaw_jump_rad: 0.5
    covariance_source: ""
    pose_variance: null
    twist_variance: null
  state:
    enabled: true
  camera:
    enabled: true
  camera_rgb_frame:
    enabled: false
    # Only set ros_system_time after verifying the Orbbec source clock.
    source_clock_domain: unverified
    image_topic: /ob_camera_head/color/image_raw
    camera_info_topic: /ob_camera_head/color/camera_info
    max_age_sec: 0.5
  camera_snapshot:
    enabled: true
    output_dir: "/opt/phanthy-motus/data/images"
    # The channel-visible path is derived from the persistent mount. Set
    # PHANTHY_CHANNEL_OUTPUT_DIR only when deployment uses another mount.
    jpeg_quality: 90
    video_fps: 20
    default_video_seconds: 5
    max_video_seconds: 60
  imu:
    enabled: true
  camera_depth:
    enabled: true
    # Raw 640x480 Z16 is 614 KiB/frame. Keep the dashboard stream below the
    # browser/DDS forwarding budget and always display the newest frame.
    hz: 8
  camera_pointcloud:
    enabled: true
    # Head camera height above the floor. The point-cloud renderer uses Y=0
    # as its grid plane, so raise the gravity-levelled cloud by this amount.
    floor_offset_m: 1.50
  asr:
    enabled: true
  nav_state:
    enabled: true
  power_board:
    enabled: true
  motors:
    enabled: true
  hand_state:
    enabled: true
  remote_event:
    enabled: true
  head:
    enabled: true
  head_gesture:
    enabled: true
  arm:
    enabled: true
  arm_gesture:
    enabled: true
  waist:
    enabled: true
  hand:
    enabled: true
  tts:
    enabled: true
  voice_play:
    enabled: true
  nav:
    enabled: true
  home:
    enabled: true
  voice_chat:
    enabled: true
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: "/opt/phanthy-motus/data/maps"
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
    password: "123456"
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
    cache_dir: "/opt/phanthy-motus/data/map-visuals"
    poll_hz: 3.0
    artifact_hz: 0.4
    head_pointcloud_enabled: true
    head_pointcloud_topic: "/ob_camera_head/depth/points"
    head_recording_enabled: false
  robot_faults:
    enabled: true
  laser_scan:
    enabled: true
  chassis_raw:
    enabled: true
  ext_mic:
    enabled: true
    network_sources:
      - ssh_host: "192.168.41.1"
        ssh_user: "ubuntu"
        ssh_password: "123"
        port: 9800
        sender_path: "/home/ubuntu/audio_sender.py"
  light:
    enabled: true
